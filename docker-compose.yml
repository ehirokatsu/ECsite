version: '3.8'

services:
  # PHP service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  # Nginx service
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  # MySQL service
  db:
    image: mysql:8.0
    platform: linux/amd64 
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ECsite
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  # Node service (servicesの中に移動しました)
  node:
    image: node:18
    container_name: node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge